
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor=,preferred,auto,auto
monitor = , preferred, auto, 1
# monitor = DP-6, 3840x2160@60, auto, 1.5
# monitor = DP-6, preferred, auto, 1.5
monitor = desc:LG Electronics LG Ultra HD 0x000174C7, 2560x1440@60, auto, 1


# change monitor to high resolution, the last argument is the scale factor
# monitor = , highres, auto, 1

# unscale XWayland
xwayland {
  force_zero_scaling = true
}

# toolkit-specific scale
# env = GDK_SCALE,2
# env = XCURSOR_SIZE,32

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$browser = vivaldi
$fileManager = yazi
# $menu = wofi --show drun
# $menu = tofi-drun
$menu = vicinae toggle
$colorPicker = hyprpicker
$scripts = ~/.config/hypr/scripts


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar
exec-once = $scripts/xdg-desktop.sh
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = hyprpaper
exec-once = waypaper --restore
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = kdeconnect-indicator
exec-once = clipse -listen
exec-once = udiskie
exec-once = vicinae server
exec-once = sleep 10 && syncthingtray --wait
# exec-once = sleep 6 && hyprctl dispatch workspace 3 && vivaldi
# exec-once = sleep 8 && hyprctl dispatch workspace 4 && thunderbird
# exec-once = sleep 10 && hyprctl dispatch workspace 2
# exec-once = hyprctl setcursor Bibata-Modern-Ice 23
exec-once = pkill kded6
# exec-once = snixembed
exec-once = swaync
exec-once = ~/.config/hypr/start_apps.sh

exec-shutdown = /usr/local/bin/example-shutdown.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

# env = XCURSOR_SIZE,23
# env = HYPRCURSOR_SIZE,23
# env = HYPRCURSOR_THEME,Bibata-Modern-Ice
# env = GTK_THEME,Orchis-Dark

env = XCURSOR_SIZE,23
env = XCURSOR_THEME,Bibata-Modern-Ice
env = GTK_THEME,Orchis-Dark

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

source = ~/.cache/wal/colors-hyprland.conf
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
  gaps_in = 5
  gaps_out = 10

  border_size = 2

  # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
  # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  # col.inactive_border = rgba(595959aa)
  # col.active_border = $color10 $color11 90feg
  col.active_border = $color10 $color11 45deg
  col.inactive_border = $background
  # bezier = linear, 0.0, 0.0, 1.0, 1.0

  # Set to true enable resizing windows by clicking and dragging on borders and gaps
  resize_on_border = false

  # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
  allow_tearing = false

  layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 8

  # Change transparency of focused and unfocused windows
  active_opacity = 0.95
  inactive_opacity = 0.8

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }
  # drop_shadow = true
  # shadow_range = 4
  # shadow_render_power = 3
  # col.shadow = rgba(1a1a1aee)

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
    enabled = true
    size = 8
    passes = 1

    vibrancy = 0.1696
    # passes = 4
    new_optimizations = on
    xray = true
    # blurls = waybar
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
# animations {
#     enabled = true

#     # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

#     bezier = myBezier, 0.05, 0.9, 0.1, 1.05

#     animation = windows, 1, 7, myBezier
