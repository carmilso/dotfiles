# -----------------------------------------------------
# Animations
# name: "High"
# -----------------------------------------------------
# animations {
#   enabled = true
#   bezier = wind, 0.05, 0.9, 0.1, 1.05
#   bezier = winIn, 0.1, 1.1, 0.1, 1.1
#   bezier = winOut, 0.3, -0.3, 0, 1
#   bezier = liner, 1, 1, 1, 1
#   animation = windows, 1, 6, wind, slide
#   animation = windowsIn, 1, 6, winIn, slide
#   animation = windowsOut, 1, 5, winOut, slide
#   animation = windowsMove, 1, 5, wind, slide
#   animation = border, 1, 1, liner
#   animation = borderangle, 1, 30, liner, loop
#   animation = fade, 1, 10, default
#   animation = workspaces, 1, 5, wind
# }

# -----------------------------------------------------
# Animations
# name "Dynamic"
# -----------------------------------------------------
animations {
  enabled = true
  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  animation = windows, 1, 6, wind, slide
  animation = windowsIn, 1, 6, winIn, slide
  animation = windowsOut, 1, 5, winOut, slide
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, liner
  animation = borderangle, 1, 30, liner, loop
  animation = fade, 1, 10, default
  animation = workspaces, 1, 5, wind
}

# -----------------------------------------------------
# Animations
# name "Moving"
# -----------------------------------------------------
# animations {
#   enabled = true
#   bezier = overshot, 0.05, 0.9, 0.1, 1.05
#   bezier = smoothOut, 0.5, 0, 0.99, 0.99
#   bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
#   animation = windows, 1, 5, overshot, slide
#   animation = windowsOut, 1, 3, smoothOut
#   animation = windowsIn, 1, 3, smoothOut
#   animation = windowsMove, 1, 4, smoothIn, slide
#   animation = border, 1, 5, default
#   animation = fade, 1, 5, smoothIn
#   animation = fadeDim, 1, 5, smoothIn
#   animation = workspaces, 1, 6, default
# }

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
  pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  # split right side only.
  force_split = 2
  preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
  new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
  force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
  disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
  disable_splash_rendering = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
  kb_layout = es
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =

  numlock_by_default = true

  follow_mouse = 1
  # mouse_refocus = false

  sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

  touchpad {
    natural_scroll = true
  }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
  # workspace_swipe = true
  # workspace_swipe_fingers = 3
  gesture = 3, horizontal, workspace
  workspace_swipe_distance = 500
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 30
  workspace_swipe_cancel_ratio = 0.5
  workspace_swipe_create_new = true
  workspace_swipe_forever = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
  name = epic-mouse-v1
  sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, F, fullscreen, 1 # Set active window to fullscreen
bind = $mainMod SHIFT, F, fullscreen # Set active window to fullscreen
bind = $mainMod ALT, L, exec, hyprlock
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive # Kill active window&&
# bind = $mainMod, M, exit,
# bind = $mainMod, E, exec, $fileManager
bind = $mainMod, M, togglefloating,
bind = $mainMod, R, exec, $menu | xargs hyprctl dispatch exec --
# bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, P, exec, $colorPicker | wl-copy
# bind = $mainMod, P, exec, $colorPicker | wl-copy
bind = $mainMod, D, togglesplit, # dwindle

bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh # change wallpaper
bind = $mainMod, Escape, exec, wlogout

# Keybinding to open a floating and centered Kitty
bind = $mainMod, E, exec, kitty --class floatingfilemanager -e $fileManager
bind = $mainMod, T, exec, kitty --class floatingfilemanager

bind = $mainMod SHIFT, V, exec, kitty --class clipse -e 'clipse'
bind = $mainMod, V, exec, vicinae vicinae://extensions/vicinae/clipboard/history
bind = $mainMod, G, exec, vicinae vicinae://extensions/vicinae/shortcut/manage
# bind = $mainMod, G, exec, vicinae vicinae://shortcut/Google search

bind = $mainMod, C, exec, ~/.config/hypr/scripts/open-calendar.sh
bind = $mainMod SHIFT, C, exec, ~/.config/hypr/scripts/open-calendar.sh w

bind = $mainMod, F12, exec, grimblast --freeze --notify copysave area "/tmp/$(date '+%d%m%y_%H-%M-%S').png"
# bind = $mainMod, PRINT, exec, grimblast --freeze --notify copysave area "/tmp/$(date '+%d%m%y_%H-%M-%S').png"
bind = $mainMod SHIFT, F12, exec, grimblast --freeze --notify copysave active "/tmp/$(date '+%d%m%y_%H-%M-%S').png"
bind = $mainMod ALT, F12, exec, grimblast --freeze --notify copysave output "/tmp/$(date '+%d%m%y_%H-%M-%S').png"

bind = $mainMod ALT, S, exec, swaync-client -d -sw

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_up, workspace, e+1
bind = $mainMod, mouse_down, workspace, e-1

# Scroll through existing workspaces with mainMod + ALT
bind = $mainMod Control_L, l, workspace, e+1
bind = $mainMod Control_L, h, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindle =, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindle =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Requires playerctl
bindl=, XF86AudioPlay, exec, playerctl play-pause
bindl=, XF86AudioPrev, exec, playerctl previous
bindl=, XF86AudioNext, exec, playerctl next

# Brightness control
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# workspace = 1, monitor:DP-6, default:true

# Open vivaldi always on workspace 3.
# windowrulev2 = workspace:3 app_id:vivaldi-stable silent
windowrulev2 = workspace:3 app_id:vivaldi-stable

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Remove the right click menu blurring in Chromium browsers.
windowrulev2 = noblur, class:^()$, title:^()$

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Rule to float and center Telegram windows
windowrulev2 = float, center 1, size 900 700, class:^(org.telegram.desktop)$

# Rule to float Slack windows
windowrulev2 = float,class:^(Slack)$
# Rule to center Slack windows
windowrulev2 = center 1,class:^(Slack)$
# Rule to set the size of Slack windows to 800x600
windowrulev2 = size 1250 1000,class:^(Slack)$

windowrulev2 = float,class:^(calendarw|calendarm)$
windowrulev2 = center 1,class:^(calendarw|calendarm)$

windowrulev2 = size 1600 1020,class:^(calendarm)$
windowrulev2 = size 800 420,class:^(calendarw)$

# Rule to float and center Kitty windows with class "floatingkitty"
windowrulev2 = float,class:^(floatingfilemanager)$
windowrulev2 = center 1,class:^(floatingfilemanager)$

# Rule to float and center Kitty windows with class "floatingkitty"
windowrulev2 = float,class:^(Spotify)$
windowrulev2 = center 1,class:^(Spotify)$
windowrulev2 = size 1250 1000,class:^(Spotify)$

windowrulev2 = float,class:(clipse) # ensure you have a floating window class set if you want this behaviour
windowrulev2 = size 622 652,class:(clipse) # set the size of the window as necessary

windowrulev2 = float,class:(calibre-ebook-viewer) # ensure you have a floating window class set if you want this behaviour
windowrulev2 = size 640 720,class:(calibre-ebook-viewer) # set the size of the window as necessary

windowrulev2 = float,class:^(blueman-manager)$

# Ignore maximize command
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

# Center and float dialogues
windowrulev2 = float, center 1,title:^(Open File|Abrir archivos|Inicia sesión|Abrir archivo)(.*)$
windowrulev2 = center 1,title:^(Open File|Abrir archivos|Inicia sesión|Abrir archivo)(.*)$
windowrulev2 = center 1,title:^(Select a File)(.*)$
windowrulev2 = center 1,title:^(Choose wallpaper)(.*)$
windowrulev2 = center 1,title:^(Open Folder)(.*)$
windowrulev2 = center 1,title:^(Save As)(.*)$
windowrulev2 = center 1,title:^(Library)(.*)$
windowrulev2 = center 1,title:^(File Upload)(.*)$
windowrulev2 = float,title:^(Open File)(.*)$
windowrulev2 = float,title:^(Select a File)(.*)$
windowrulev2 = float,title:^(Choose wallpaper)(.*)$
windowrulev2 = float,title:^(Open Folder)(.*)$
windowrulev2 = float,title:^(Save As|Todos los archivos)(.*)$
windowrulev2 = float,title:^(Library)(.*)$
windowrulev2 = float,title:^(File Upload)(.*)$

windowrulev2 = size 1200 800,class:(xdg-desktop-portal-gtk) # set the size of the window as necessary
windowrulev2 = size 1200 800,class:(xdg-desktop-portal-kde) # set the size of the window as necessary

windowrulev2 = noborder, class:(swaync) # ensure you have a floating window class set if you want this behaviour

windowrule = opacity 1.0 override, class:(vivaldi-stable)

# Gnome Calculator
windowrulev2 = float,class:(org.gnome.Calculator)
windowrulev2 = center 1,class:(org.gnome.Calculator)

# waypaper floating
windowrulev2 = float,class:(waypaper)
windowrulev2 = size 1200 800,class:(waypaper)
windowrulev2 = center 1,class:(waypaper)
windowrulev2 = pin,class:(waypaper)

# Pavucontrol floating
windowrulev2 = float,class:(.*org.pulseaudio.pavucontrol.*)
windowrulev2 = size 700 600,class:(.*org.pulseaudio.pavucontrol.*)
windowrulev2 = center 1,class:(.*org.pulseaudio.pavucontrol.*)
windowrulev2 = pin,class:(.*org.pulseaudio.pavucontrol.*)

# windowrulev2 = opacity 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = immediate,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,nofocus,noblur,maxsize 1 1,class:^(xwaylandvideobridge)$
# windowrulev2 = noanim,class:^(xwaylandvideobridge)$
# windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
# windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
# windowrulev2 = noblur,class:^(xwaylandvideobridge)$

windowrulev2 = pin,title:^(Imagen en imagen)$

layerrule = blur,swaync-notification-window
layerrule = ignorezero,swaync-notification-window
layerrule = blur,swaync-control-center
layerrule = ignorezero,swaync-control-center

layerrule = blur, logout_dialog

# Desenfocar la barra
layerrule = blur, waybar
# Respetar la transparencia (opcional)
layerrule = ignorealpha 0.55, waybar
layerrule = ignorezero, waybar

# blur
layerrule = blur,vicinae
layerrule = ignorealpha 0, vicinae

# disable fade animation for vicinae only
layerrule = noanim, vicinae

# -----------------------------------------------------
# Environment for xdg-desktop-portal-hyprland
# -----------------------------------------------------
# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct;qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# SDL version
env = SDL_VIDEODRIVER,wayland
# env = SDL_VIDEODRIVER,x11

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
